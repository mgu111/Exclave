name: Debug Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/debug.yml"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Build ByeDPI (libciadpi.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          git clone --depth 1 --branch v0.17.3 https://github.com byedpi_src
          python3 - << 'EOF'
          with open("byedpi_src/desync.c", "r") as f:
              code = f.read()
          code = code.replace(
              "#include <linux/filter.h>",
              "#include <linux/filter.h>\n    #include <sys/ioctl.h>\n    #include <linux/sockios.h>"
          )
          old_block = '''    if (ts <= offsetof(struct tcp_info, tcpi_notsent_bytes)) {
                  LOG(LOG_E, "tcpi_notsent_bytes not provided\\n");
                  return 0;
              }'''
          new_block = '''    if (ts <= offsetof(struct tcp_info, tcpi_notsent_bytes)) {
                  int notsent = 0;
                  if (ioctl(sfd, TIOCOUTQ, &notsent) < 0) {
                      return 0;
                  }
                  return notsent > 0;
              }'''
          assert old_block in code, "Target block not found in desync.c!"
          code = code.replace(old_block, new_block, 1)
          with open("byedpi_src/desync.c", "w") as f:
              f.write(code)
          EOF

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRCS="byedpi_src/main.c byedpi_src/proxy.c byedpi_src/desync.c byedpi_src/packets.c byedpi_src/conev.c byedpi_src/extend.c byedpi_src/mpool.c"
          FLAGS="-O2 -fPIE -pie -DFAKE_SUPPORT -DTIMEOUT_SUPPORT"

          mkdir -p app/src/main/jniLibs/armeabi-v7a \
                   app/src/main/jniLibs/arm64-v8a \
                   app/src/main/jniLibs/x86 \
                   app/src/main/jniLibs/x86_64

          $NDK_BIN/armv7a-linux-androideabi21-clang $FLAGS $SRCS -o app/src/main/jniLibs/armeabi-v7a/libciadpi.so
          $NDK_BIN/aarch64-linux-android21-clang $FLAGS $SRCS -o app/src/main/jniLibs/arm64-v8a/libciadpi.so
          $NDK_BIN/i686-linux-android21-clang $FLAGS $SRCS -o app/src/main/jniLibs/x86/libciadpi.so
          $NDK_BIN/x86_64-linux-android21-clang $FLAGS $SRCS -o app/src/main/jniLibs/x86_64/libciadpi.so
          rm -rf byedpi_src
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core debug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-debug-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssDebug 
          ./gradlew :app:assembleLegacyDebug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/debug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs-legacy
          path: app/build/outputs/apk/legacy/debug
