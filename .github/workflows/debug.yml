      - name: Build ByeDPI (libciadpi.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          REPO_OWNER="hufrea"
          REPO_NAME="byedpi"
          curl -sL "https://github.com{REPO_OWNER}/${REPO_NAME}/tar.gz/refs/tags/v0.17.3" | tar -xz
          mv byedpi-0.17.3 byedpi_src

          python3 - << 'EOF'
          with open("byedpi_src/desync.c", "r") as f:
              code = f.read()
          code = code.replace(
              "#include <linux/filter.h>",
              "#include <linux/filter.h>\n    #include <sys/ioctl.h>\n    #include <linux/sockios.h>"
          )
          old_block = '''    if (ts <= offsetof(struct tcp_info, tcpi_notsent_bytes)) {
                  LOG(LOG_E, "tcpi_notsent_bytes not provided\\n");
                  return 0;
              }'''
          new_block = '''    if (ts <= offsetof(struct tcp_info, tcpi_notsent_bytes)) {
                  int notsent = 0;
                  if (ioctl(sfd, TIOCOUTQ, &notsent) < 0) {
                      return 0;
                  }
                  return notsent > 0;
              }'''
          assert old_block in code, "Target block not found in desync.c!"
          code = code.replace(old_block, new_block, 1)
          with open("byedpi_src/desync.c", "w") as f:
              f.write(code)
          EOF

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRCS="byedpi_src/main.c byedpi_src/proxy.c byedpi_src/desync.c byedpi_src/packets.c byedpi_src/conev.c byedpi_src/extend.c byedpi_src/mpool.c"
          FLAGS="-O2 -fPIE -pie -DFAKE_SUPPORT -DTIMEOUT_SUPPORT"

          mkdir -p app/src/main/jniLibs/armeabi-v7a \
                   app/src/main/jniLibs/arm64-v8a \
                   app/src/main/jniLibs/x86 \
                   app/src/main/jniLibs/x86_64

          $NDK_BIN/armv7a-linux-androideabi21-clang $FLAGS $SRCS -o app/src/main/jniLibs/armeabi-v7a/libciadpi.so
          $NDK_BIN/aarch64-linux-android21-clang $FLAGS $SRCS -o app/src/main/jniLibs/arm64-v8a/libciadpi.so
          $NDK_BIN/i686-linux-android21-clang $FLAGS $SRCS -o app/src/main/jniLibs/x86/libciadpi.so
          $NDK_BIN/x86_64-linux-android21-clang $FLAGS $SRCS -o app/src/main/jniLibs/x86_64/libciadpi.so
          rm -rf byedpi_src
